<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FF14 Journey｜冒險者百科書庫</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23536d70%22%2F%3E%3Cpath%20d%3D%22M32%2025c-8-6-16-7-23-5v26c7-2%2015-1%2023%205%208-6%2016-7%2023-5V20c-7-2-15-1-23%205Z%22%20fill%3D%22%23faf4e4%22%2F%3E%3Cpath%20d%3D%22M32%2025v26M16%2028l9%203m-9%205%209%203m14-8%209-3m-9%2011%209-3%22%20fill%3D%22none%22%20stroke%3D%22%23536d70%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22m32%205%202.5%206.5L41%2014l-6.5%202.5L32%2023l-2.5-6.5L23%2014l6.5-2.5Z%22%20fill%3D%22%23d8bd7e%22%2F%3E%3C%2Fsvg%3E"><meta name="description" content="收藏、戰鬥與故事，三座分館與六個入口，典藏一路累積的 FF14 冒險。">
<style>
:root{color-scheme:light;--ink:#343d3b;--muted:#66706d;--line:#d9d7cd;--paper:#f0ede4;--sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--ink);background:var(--paper);font-family:var(--sans);font-size:16px;letter-spacing:.01em;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at 40% 0%,#fffdf6 0%,#fffdf600 70%)}
main{width:100%;max-width:1344px;margin:0 auto;padding:54px 52px 48px;flex:1 0 auto}.identity{text-align:center;margin-bottom:38px}.wordmark{font-family:var(--sans);font-size:clamp(36px,3.8vw,50px);letter-spacing:.015em;margin:0 0 10px;font-weight:650;line-height:1.25}.identity h1{font-size:22px;font-weight:500;letter-spacing:.18em;margin:0}.identity .lead{font-size:15px;letter-spacing:.04em;color:var(--muted);margin:20px 0 0;line-height:1.8}
.catalogue{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.branch{min-width:0;--accent:#8c7440;--edge:#d6c8a7;--tint:#ebe2cd;--base:#f7f2e8;border:1px solid var(--edge);border-radius:12px;background:var(--base);overflow:hidden;box-shadow:0 10px 30px #3f38290a}.battle{--accent:#526d78;--edge:#bccbd0;--tint:#dce7e9;--base:#eff3f3}.lore{--accent:#846577;--edge:#d3c0cb;--tint:#e8dde3;--base:#f6f0f3}.branch-heading{padding:24px 20px 27px;text-align:center;background:var(--tint);border-bottom:1px solid var(--edge)}
.geometry{width:110px;height:110px;margin:0 auto 12px;pointer-events:none}.geometry svg{display:block;width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.geometry .disc{fill:var(--base);stroke:var(--edge)}.geometry .solid{fill:var(--accent);stroke:var(--accent)}.geometry .surface{fill:var(--base)}.geometry .facet{fill:var(--tint)}.geometry .light-line{stroke:var(--base)}.english{font-family:var(--sans);font-size:13px;font-weight:650;color:var(--accent);letter-spacing:.15em;margin:0 0 9px}.branch h2{font-size:30px;letter-spacing:.08em;font-weight:650;margin:0 0 13px;line-height:1.35}.intro{font-size:14px;line-height:1.8;margin:0;color:#596360}
.entrances{display:grid;gap:15px;padding:23px}.entrance{font:inherit;text-decoration:none;color:var(--ink);width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:23px 20px;min-height:128px;border:1px solid var(--edge);border-radius:8px;background:#fffdf9;cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s;box-shadow:0 3px 8px #383d3204}.entrance:hover{background:#fff;border-color:var(--accent);box-shadow:0 5px 16px #383d3210;transform:translateY(-2px)}.entry-copy{display:grid;gap:9px}.entry-name{font-size:22px;font-weight:650;letter-spacing:.015em;line-height:1.4}.entry-description{font-size:14px;line-height:1.65;color:var(--muted)}.arrow{color:var(--accent);font-size:19px;flex-shrink:0}.entrance:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #526d78;outline-offset:4px}
footer{width:calc(100% - 104px);max-width:1240px;margin:0 auto;padding:23px 16px 27px;border-top:1px solid #d1cec1;text-align:center;color:#727872;font-family:var(--sans);font-size:13px;line-height:1.8;flex-shrink:0}.footer-credit{display:block;font-weight:650}.footer-brand{display:block}.footer-rights{display:block;font-size:11px;color:#7b817b;margin-top:5px}
dialog{border:1px solid var(--line);border-radius:10px;padding:34px;width:min(440px,calc(100% - 40px));background:#f8f5ee;color:var(--ink);font-family:var(--sans);box-shadow:0 20px 80px #303b3826}dialog::backdrop{background:#25353145;backdrop-filter:blur(4px)}.dialog-path{font-size:13px;line-height:1.7;color:var(--muted)}dialog h2{font-size:23px;font-weight:650;margin:20px 0}dialog p{font-size:16px;line-height:1.9}.close{font:inherit;background:#fffdf9;border:1px solid #b7bcb4;border-radius:5px;padding:11px 22px;color:var(--ink);cursor:pointer;margin-top:14px;min-height:44px}
@media(min-width:1450px){main{padding-top:72px}.identity{margin-bottom:45px}.catalogue{gap:36px}}
@media(max-width:1100px){main{padding:42px 28px 40px}.catalogue{gap:18px}.entrances{padding:18px}.entrance{padding:21px 16px}.entry-name{font-size:21px}.intro{font-size:13px}.branch h2{font-size:28px}footer{width:calc(100% - 56px)}}
@media(max-width:900px){main{max-width:540px;padding:36px 24px 36px}.identity{margin-bottom:30px}.identity h1{font-size:20px}.identity .lead{font-size:14px;letter-spacing:0}.catalogue{grid-template-columns:1fr;gap:25px}.branch-heading{padding:24px 20px}.geometry{width:100px;height:100px}.branch h2{font-size:29px}.intro{font-size:14px}.entrances{padding:21px;gap:14px}.entrance{min-height:122px;padding:21px 20px}.entry-name{font-size:22px}footer{width:calc(100% - 48px);max-width:492px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.entrance:hover{transform:none}dialog::backdrop{backdrop-filter:none}}

/* Desktop composition adapts to available viewport height, retaining readable entry text. */
@media(min-width:901px){
 main{padding-top:clamp(24px,4.8vh,56px);padding-bottom:24px}
 .identity{margin-bottom:28px}.wordmark{font-size:44px;line-height:1.2}.identity .lead{margin-top:12px}
 .branch-heading{padding:18px 20px 22px}.geometry{width:88px;height:88px;margin-bottom:8px}.branch h2{margin-bottom:10px}
 .entrances{padding:20px;gap:12px}.entrance{min-height:112px;padding:18px 20px}
 footer{padding:14px 16px 18px;font-size:12px}
}
@media(min-width:901px) and (max-height:800px){
 main{padding-top:24px;padding-bottom:18px}.identity{margin-bottom:22px}.wordmark{font-size:40px}.identity .lead{margin-top:10px}
 .branch-heading{padding:16px 20px 18px}.geometry{width:72px;height:72px;margin-bottom:6px}.branch h2{font-size:28px;margin-bottom:8px}
 .entrances{padding:17px;gap:10px}.entrance{min-height:102px;padding:16px 18px}.entry-copy{gap:7px}
 footer{padding:12px 16px 14px}
}
@media(min-width:901px) and (max-height:700px){
 main{padding-top:18px;padding-bottom:15px}.identity{margin-bottom:18px}.wordmark{font-size:36px;margin-bottom:7px}.identity .lead{margin-top:8px}
 .geometry{width:60px;height:60px}.branch-heading{padding-top:12px;padding-bottom:14px}.english{margin-bottom:6px}
 .entrances{padding:15px;gap:10px}.entrance{min-height:94px;padding:14px 16px}
 footer{padding:9px 16px 12px}.footer-rights{margin-top:3px}
}

/* Clearer labels and secondary copy, with line boxes balanced against the approved layout. */
.collection{--label:#705a2f}.battle{--label:#3e5965}.lore{--label:#6d4c60}
.english{font-size:20px;font-weight:750;line-height:1.25;letter-spacing:.07em;color:var(--label);margin-bottom:5px}
.identity h1{font-size:24px;line-height:1.15}
.identity .lead{font-size:17px;line-height:1.6;color:#56635e}
.intro{font-size:16px;line-height:1.6;color:#485650}
.entry-description{font-size:16px;line-height:1.45;color:#53615c}
@media(min-width:901px){.geometry{margin-bottom:4px}}

/* Gentle gradients keep each collection's identity at equal visual weight. */
.collection{--header-gradient:linear-gradient(120deg,#f3ead3 0%,#ebe3ce 52%,#e5eadc 100%);--panel-gradient:linear-gradient(160deg,#faf6ec 0%,#f3eddf 100%);--entry-gradient:linear-gradient(110deg,#fffdf9 0%,#fbf7ed 60%,#f3efdf 100%)}
.battle{--header-gradient:linear-gradient(120deg,#e4eff1 0%,#dae7e9 52%,#e4e9ed 100%);--panel-gradient:linear-gradient(160deg,#f3f7f7 0%,#eaf0f2 100%);--entry-gradient:linear-gradient(110deg,#fffefd 0%,#f3f8f9 60%,#eaf2f4 100%)}
.lore{--header-gradient:linear-gradient(120deg,#f2e4e9 0%,#e9dee7 52%,#e4e7ee 100%);--panel-gradient:linear-gradient(160deg,#faf4f7 0%,#f0ebf3 100%);--entry-gradient:linear-gradient(110deg,#fffdfc 0%,#f9f3f7 60%,#f0ecf5 100%)}
.branch{background:var(--panel-gradient)}.branch-heading{background:var(--header-gradient)}.entrance,.entrance:hover{background:var(--entry-gradient)}
</style></head><body>
<main><div class="identity"><p class="wordmark">FF14 Journey</p><h1>冒險者百科書庫</h1><p class="lead">珍藏旅途所得，探索尚未讀完的世界。</p></div>
<div class="catalogue" aria-label="三大分館與六個館藏入口"><section class="branch collection" aria-labelledby="collection-title">
      <div class="branch-heading"><div class="geometry"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="disc" cx="80" cy="80" r="66"/><path d="M30 50v60m100-60v60M50 30h60m-60 100h60"/><path class="solid" d="m80 37 39 39-39 47-39-47z"/><path class="facet" d="m80 37 18 39H62z"/><path class="surface" d="m62 76 18 47 18-47z"/><path class="light-line" d="M41 76h78M80 37v39"/><circle class="solid" cx="30" cy="30" r="3"/><circle class="solid" cx="130" cy="130" r="3"/></svg></div><p class="english">Collection</p><h2 id="collection-title">收藏分館</h2><p class="intro">將一路獲得的珍藏，安放於此。</p></div>
      <div class="entrances"><a class="entrance" href="https://sixteenpct.github.io/ffxiv_workbench/" target="_blank" rel="noopener noreferrer"><span class="entry-copy"><span class="entry-name">素材製作工坊</span><span class="entry-description">製作、素材與背包整理</span></span><span class="arrow" aria-hidden="true">↗</span></a><button class="entrance" type="button" data-title="永久收藏圖鑑" data-branch="收藏分館"><span class="entry-copy"><span class="entry-name">永久收藏圖鑑</span><span class="entry-description">記錄值得長久珍藏的冒險成果</span></span><span class="arrow" aria-hidden="true">↗</span></button></div>
    </section><section class="branch battle" aria-labelledby="battle-title">
      <div class="branch-heading"><div class="geometry"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="disc" cx="80" cy="80" r="66"/><path d="m37 42 86 76m-86 0 86-76"/><path class="solid" d="m80 38 30 12v36c0 20-15 33-30 41-15-8-30-21-30-41V50z"/><path class="facet" d="m80 38 30 12v36c0 20-15 33-30 41z"/><path class="surface" d="m80 53 7 15-3 32h-8l-3-32z"/><path class="light-line" d="M65 101h30m-15 0v15m-6 0h12"/><circle class="solid" cx="37" cy="42" r="3"/><circle class="solid" cx="123" cy="118" r="3"/></svg></div><p class="english">PvE</p><h2 id="battle-title">戰鬥分館</h2><p class="intro">在每一次練習中，讀懂冒險的力量。</p></div>
      <div class="entrances"><button class="entrance" type="button" data-title="職業圖鑑" data-branch="戰鬥分館"><span class="entry-copy"><span class="entry-name">職業圖鑑</span><span class="entry-description">探索各職業的特色與戰鬥方式</span></span><span class="arrow" aria-hidden="true">↗</span></button><button class="entrance" type="button" data-title="PvE 課程書庫" data-branch="戰鬥分館"><span class="entry-copy"><span class="entry-name">PvE 課程書庫</span><span class="entry-description">循序學習，累積實戰知識</span></span><span class="arrow" aria-hidden="true">↗</span></button></div>
    </section><section class="branch lore" aria-labelledby="lore-title">
      <div class="branch-heading"><div class="geometry"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="disc" cx="80" cy="80" r="66"/><path class="solid" d="M80 64c-16-12-31-14-47-11v53c16-3 31-1 47 11 16-12 31-14 47-11V53c-16-3-31-1-47 11z"/><path class="surface" d="M80 64c16-12 31-14 47-11v53c-16-3-31-1-47 11z"/><path class="light-line" d="M44 68c9 0 17 2 25 7M44 81c9 0 17 2 25 7M44 94c9 0 17 2 25 7"/><path d="M91 75c8-5 16-7 25-7M91 88c8-5 16-7 25-7M91 101c8-5 16-7 25-7M80 64v53"/><path class="facet" d="m80 25 7 7-7 7-7-7z"/><path d="M48 126h64"/></svg></div><p class="english">Lore</p><h2 id="lore-title">故事分館</h2><p class="intro">循著文字與回憶，走進世界的深處。</p></div>
      <div class="entrances"><button class="entrance" type="button" data-title="Lore 故事書庫" data-branch="故事分館"><span class="entry-copy"><span class="entry-name">Lore 故事書庫</span><span class="entry-description">閱讀世界、人物與旅途的故事</span></span><span class="arrow" aria-hidden="true">↗</span></button><button class="entrance" type="button" data-title="歷代 FF 致敬" data-branch="故事分館"><span class="entry-copy"><span class="entry-name">歷代 FF 致敬</span><span class="entry-description">尋找跨越作品的經典與回聲</span></span><span class="arrow" aria-hidden="true">↗</span></button></div>
    </section></div>
</main><footer><span class="footer-credit">© sixteenpct · FF14 JOURNEY</span><span class="footer-brand">冒險者百科書庫 · 收藏 / 戰鬥 / 故事</span><small class="footer-rights">FINAL FANTASY XIV © SQUARE ENIX · 非官方玩家網站</small></footer>
<dialog id="entry-dialog" aria-labelledby="dialog-title"><p class="dialog-path" id="dialog-path"></p><h2 id="dialog-title"></h2><p>此館藏入口尚未開放。<br>先在這裡，為下一段探索留一個位置。</p><form method="dialog"><button class="close">返回書庫</button></form></dialog>
<script>
const entryDialog=document.getElementById('entry-dialog');
document.querySelectorAll('button.entrance').forEach(button=>button.addEventListener('click',()=>{
 document.getElementById('dialog-title').textContent=button.dataset.title;
 document.getElementById('dialog-path').textContent='FF14 Journey ／ '+button.dataset.branch;
 entryDialog.showModal();
}));
entryDialog.addEventListener('click',event=>{if(event.target===entryDialog){const r=entryDialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)entryDialog.close();}});
</script></body></html>
